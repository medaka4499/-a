<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小役カウンター">
<link rel="manifest" href="manifest.webmanifest">
<title>カウンター v1.1.1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
html{touch-action:pan-y;-webkit-text-size-adjust:100%;overscroll-behavior:none}body{margin:0;touch-action:pan-y;background:#0b0f14;color:#f5f7fa;min-height:100vh;touch-action:pan-y;overscroll-behavior:none}
main{max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 24px)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:22px;margin:0}.sub{font-size:12px;color:#7f8a99;margin-top:3px}
button{border:0;touch-action:manipulation;color:#fff;font:inherit;font-weight:700;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none} input,select{user-select:text;-webkit-user-select:text;touch-action:manipulation;-webkit-appearance:none;font-size:16px} input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.headerBtn{background:#222a35;border-radius:12px;padding:10px 12px}
.card{background:#151b23;border:1px solid #27303c;border-radius:18px;padding:15px;margin-bottom:11px}
.label{font-size:12px;color:#9da8b7}
.machineRow{display:grid;grid-template-columns:1fr auto;gap:5px;align-items:center}.machineRow select{height:30px;padding:0 8px;font-size:16px}.machineMinus{width:34px;height:30px;border-radius:9px;background:#343d49;font-size:20px}
.topGrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-bottom:7px}.machineTop{grid-column:1 / -1;height:62px}.compactCard{padding:4px 6px;height:62px;min-height:62px}.gamePair{display:grid;grid-template-columns:1fr 1fr;gap:5px}.compactJudge{height:34px;margin-top:4px}.ginput{height:34px;font-size:18px;padding:0 6px}
.topCard{background:#151b23;border:1px solid #27303c;border-radius:14px;padding:7px}
.judgeBtn{width:100%;height:34px;border-radius:10px;background:#2563eb}.rateBtn{width:100%;height:34px;border-radius:10px;background:#343d49;font-size:14px}.rateBtn.active{background:#2563eb}
.counterGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.counterGrid .card{margin-bottom:0}
select{width:100%;height:30px;border-radius:10px;border:1px solid #303a48;background:#0d1218;color:#fff;padding:0 12px;font:inherit;font-weight:700}
.gbox{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch;padding:10px}
.gitem{background:#10151c;border-radius:12px;padding:10px}.gcount,.startGames{font-size:24px;font-weight:800;letter-spacing:-1px;cursor:pointer;margin-top:3px}.ginput{width:100%;height:34px;border:1px solid #303a48;border-radius:9px;background:#0d1218;color:#fff;padding:0 8px;font:inherit;font-size:20px;font-weight:800;touch-action:manipulation}.ginput:focus{outline:2px solid #2563eb}

.primary,.plus{background:#2563eb!important}
.counter{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.name{font-size:18px;font-weight:800}.rate{font-size:15px;font-weight:800;color:#f5f7fa;margin-top:4px}
.actions{display:flex;gap:7px}.minus{width:48px;height:58px;border-radius:14px;background:#343d49;font-size:22px}
.plus{width:76px;height:58px;border-radius:14px;font-size:28px}
.small{margin-top:7px;font-size:11px;color:#687585}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#10151c;border-radius:14px;padding:11px}
.stat b{display:block;font-size:19px;margin-top:3px}
.reset{width:100%;height:48px;border-radius:14px;color:#ffb4b4;background:#2a2022;margin-top:2px}
footer{text-align:center;color:#8b98aa;font-size:12px;font-weight:700;padding:12px 8px 4px;margin-top:8px;border-top:1px solid #27303c}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:5}
.sheet{width:100%;max-width:560px;margin:auto;background:#151b23;border-radius:22px 22px 0 0;padding:18px}
.sheet input{width:100%;height:48px;border-radius:12px;border:1px solid #303a48;background:#0d1218;color:#fff;padding:0 12px;font-size:17px}
.sheetRow{display:flex;gap:8px;margin-top:10px}.sheetRow button{flex:1;height:46px;border-radius:12px;background:#2a3340}.sheetRow .primary{background:#2563eb}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.keypad button{height:52px;border-radius:12px;background:#2a3340;font-size:20px}.keypad .wide{grid-column:span 2}
.item{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:10px 0;border-bottom:1px solid #26303b}.del{background:#3a2528;border-radius:9px;padding:7px 10px;color:#ffb4b4}
</style>
</head>
<body>
<main>
<div class="topGrid">
<section class="topCard compactCard machineTop"><div class="label">機種</div><div class="machineRow" style="margin-top:6px"><select id="machine"></select><button class="machineMinus" id="machineMinus">−</button></div></section>
<section class="topCard compactCard"><div class="label">総ゲーム</div><input class="ginput" id="gamesInput" type="number" inputmode="numeric" min="0" step="1" value="0"></section>
<section class="topCard compactCard"><div class="label">打ち始め</div><input class="ginput" id="startGamesInput" type="number" inputmode="numeric" min="0" step="1" value="0"></section>
<section class="topCard compactCard"><div class="label">当選率</div><button class="rateBtn" id="rateBtn">当選率</button></section>
<section class="topCard compactCard"><div class="label">設定判別</div><button class="judgeBtn compactJudge" id="judge">設定判別</button></section>
</div>
<div id="counters" class="counterGrid"></div>

<button class="reset" id="reset">この機種のデータをリセット</button>
<button class="headerBtn" id="manage" style="width:100%;margin-top:10px">⚙ 機種を追加・管理</button>
<footer><span>Ver. 1.1.3</span></footer>
</main>
<div class="modal" id="modal"><div class="sheet"><div class="label">機種を追加</div><div style="margin-top:7px"><input id="newMachine" maxlength="40" placeholder="例：マイジャグラーV"></div><div class="sheetRow"><button id="close">閉じる</button><button class="primary" id="add">追加</button></div><div id="machines"></div></div></div>
<script>
const KEY="koyaku-counter-v3",OLD_KEY="koyaku-counter-v2",DEFAULT_COUNTERS=["ベル","スイカ","チェリー"],DEFAULT_MACHINES=["マイジャグラーV","アイムジャグラーEX","その他"];
let minusMode=false;
function blankMachine(){return {games:0,startGames:0,counters:DEFAULT_COUNTERS.map(name=>({name,count:0}))}}
let state=JSON.parse(localStorage.getItem(KEY)||"null");
if(!state){const old=JSON.parse(localStorage.getItem(OLD_KEY)||"null");state={selected:"マイジャグラーV",machines:{}};DEFAULT_MACHINES.forEach(n=>state.machines[n]=blankMachine());if(old)state.machines["マイジャグラーV"]={games:old.games||0,startGames:old.startGames||0,counters:(old.counters||[]).map(c=>({name:c.name,count:c.count||0}))};localStorage.setItem(KEY,JSON.stringify(state))}
function current(){return state.machines[state.selected]}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function rate(n){const games=Number(current().games)||0;const count=Number(n)||0;return games>0&&count>0?`1/${(games/count).toFixed(2)}`:"—"}
function renderMachineSelect(){const s=document.getElementById("machine");s.innerHTML="";Object.keys(state.machines).forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n;o.selected=n===state.selected;s.appendChild(o)})}
function render(){renderMachineSelect();const d=current();document.getElementById("gamesInput").value=d.games;document.getElementById("startGamesInput").value=d.startGames||0;const root=document.getElementById("counters");root.innerHTML="";d.counters.forEach(c=>{const card=document.createElement("section");card.className="card counter";card.innerHTML='<div><div class="name"></div><div class="rate"></div></div>';card.querySelector(".name").textContent=c.name+"  "+c.count;card.querySelector(".rate").textContent=rate(c.count);let pressTimer=null; let longPress=false;
card.addEventListener("pointerdown",()=>{longPress=false;pressTimer=setTimeout(()=>{longPress=true;const v=prompt(`${c.name} のカウントを入力`,String(c.count));if(v!==null){const n=parseInt(v,10);if(!Number.isNaN(n)&&n>=0){c.count=n;save()}}},600)});
card.addEventListener("pointerup",()=>{clearTimeout(pressTimer);if(!longPress){c.count=Math.max(0,c.count+(minusMode?-1:1));save()}});
card.addEventListener("pointerleave",()=>clearTimeout(pressTimer));root.appendChild(card)});const total=d.counters.reduce((a,c)=>a+c.count,0),top=d.counters.reduce((a,c)=>c.count>a.count?c:a,{name:"—",count:0});document.getElementById("total").textContent=total;document.getElementById("top").textContent=top.count?`${top.name} ${top.count}`:"—";renderMachineList()}
function renderMachineList(){const e=document.getElementById("machines");e.innerHTML="";Object.keys(state.machines).forEach(n=>{const r=document.createElement("div");r.className="item";r.innerHTML='<span></span><button class="del">削除</button>';r.firstChild.textContent=n;r.querySelector(".del").onclick=()=>{if(Object.keys(state.machines).length<=1){alert("機種は1台以上必要です");return}if(confirm(`「${n}」を削除しますか？`)){delete state.machines[n];if(state.selected===n)state.selected=Object.keys(state.machines)[0];save()}};e.appendChild(r)})}
document.getElementById("machine").onchange=e=>{state.selected=e.target.value;save()};
document.getElementById("machineMinus").onclick=()=>{minusMode=!minusMode;document.getElementById("machineMinus").textContent=minusMode?"＋":"−";document.getElementById("machineMinus").style.background=minusMode?"#2563eb":"#343d49";};
document.getElementById("judge").onclick=()=>alert("設定判別機能は準備中です。小役データをもとに判別機能を追加できます。");
let rateSetting=1;
document.getElementById("rateBtn").onclick=()=>{rateSetting=rateSetting>=6?1:rateSetting+1;const b=document.getElementById("rateBtn");b.textContent=`設定${rateSetting}`;b.classList.add("active");};
function setupGameInput(id,key){const el=document.getElementById(id);el.addEventListener("focus",()=>{if(el.value==="0")el.value=""});el.addEventListener("click",()=>{if(el.value==="0")el.value=""});el.addEventListener("blur",()=>{if(el.value==="")el.value="0"});el.addEventListener("change",()=>{current()[key]=Math.max(0,parseInt(el.value||"0",10)||0);save()})}
setupGameInput("gamesInput","games");setupGameInput("startGamesInput","startGames");
document.getElementById("reset").onclick=()=>{if(confirm(`「${state.selected}」のゲーム数と小役カウントをリセットしますか？`)){current().games=0;current().startGames=0;current().counters.forEach(c=>c.count=0);save()}};
const modal=document.getElementById("modal");document.getElementById("manage").onclick=()=>{modal.style.display="flex";document.getElementById("newMachine").focus()};document.getElementById("close").onclick=()=>modal.style.display="none";document.getElementById("add").onclick=()=>{const i=document.getElementById("newMachine"),n=i.value.trim();if(!n)return;if(state.machines[n]){alert("その機種はすでに登録されています");return}state.machines[n]=blankMachine();state.selected=n;i.value="";save();modal.style.display="none"};
let lastTouchEnd=0;
document.addEventListener("touchstart",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener("touchend",e=>{const now=Date.now();if(now-lastTouchEnd<450)e.preventDefault();lastTouchEnd=now},{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
document.addEventListener("gestureend",e=>e.preventDefault(),{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));render();
</script>
</body>
</html>
