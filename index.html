function blankMachine(){return {modes:{通常:blankData(),合成:blankData()},modeOrder:['通常','合成']}}

if(!state){const old=JSON.parse(localStorage.getItem(OLD_KEY)||"null");state={selected:"マイジャグラーV",machines:{}};DEFAULT_MACHINES.forEach(n=>state.machines[n]=blankMachine());if(old)state.machines["マイジャグラーV"].modes.通常={games:old.games||0,startGames:old.startGames||0,counters:(old.counters||[]).map(c=>({name:c.name,count:c.count||0})),layout:'2'};localStorage.setItem(KEY,JSON.stringify(state))}

function evalFormula(data,formula,counter){
  const games=Number(data?.games)||0;
  const start=Number(data?.startGames)||0;
  let expr=String(formula||'').trim();
  if(!expr)return 0;
  expr=expr.replace(/総ゲーム\s*[-−－ー]\s*打ち始めゲーム数/g,'(総ゲーム-打ち始めゲーム数)');

            row.style.minWidth=drag.width+'px';
            row.style.maxWidth=drag.width+'px';
            row.style.minHeight=drag.height+'px';
            row.style.maxHeight=drag.height+'px';
            row.style.margin='0';
            row.style.boxSizing='border-box';
            row.style.zIndex='9999';
            row.style.pointerEvents='none';
          }
          row.style.transform=`translate3d(${dx}px,${dy}px,0)`;
          const others=getRows();
          let target=others.length;
          for(let i=0;i<others.length;i++){
            const rect=others[i].getBoundingClientRect();
            if(e.clientY < rect.top + rect.height/2){target=i;break}
          }
          if(target!==drag.target){
            drag.target=target;
            const before=others[target];
            if(before) list.insertBefore(drag.placeholder,before);
            else list.appendChild(drag.placeholder);
          }
        };
        const end=(e)=>{
          if(!drag||drag.row!==row)return;
          if(e)e.preventDefault();
          if(drag.moved){
            row.style.position='';
            row.style.left='';
            row.style.top='';
            row.style.width='';
            row.style.height='';
            row.style.minWidth='';
            row.style.maxWidth='';
            row.style.minHeight='';
            row.style.maxHeight='';
            row.style.margin='';
            row.style.boxSizing='';
            row.style.zIndex='';
            row.style.pointerEvents='';
            row.style.transform='';
            list.insertBefore(row,drag.placeholder);
            // ドロップした時点のDOM順を即座にデータへ反映する。
            const droppedNames=[...list.querySelectorAll('.item button:not(.del)')].map(b=>b.textContent);
            const droppedMap=new Map(d.counters.map(c=>[c.name,c]));
            const droppedOrder=droppedNames.map(n=>droppedMap.get(n)).filter(Boolean);
            if(droppedOrder.length===d.counters.length){
              d.counters=droppedOrder;
              machine.modes[editMode]=d;
              localStorage.setItem(KEY,JSON.stringify(state));
            }
          }
          drag.placeholder.remove();
          handle.removeEventListener('pointermove',move);
          handle.removeEventListener('pointerup',end);
          handle.removeEventListener('pointercancel',end);
          if(drag.pointerId!=null){try{handle.releasePointerCapture(drag.pointerId)}catch(_){} }
          drag=null;
        };
        handle.addEventListener('pointerdown',e=>{
          if(e.button!==undefined&&e.button!==0)return;
          e.preventDefault();
          try{handle.setPointerCapture(e.pointerId)}catch(_){}
          const rect=row.getBoundingClientRect();
          const ph=document.createElement('div');
          ph.style.cssText=`height:${rect.height}px;width:${rect.width}px;min-width:${rect.width}px;max-width:${rect.width}px;min-height:${rect.height}px;max-height:${rect.height}px;margin:8px 0 0;box-sizing:border-box;display:none;pointer-events:none`;
          row.parentNode.insertBefore(ph,row.nextSibling);
          drag={row,startY:e.clientY,startX:e.clientX,left:rect.left,top:rect.top,width:rect.width,height:rect.height,placeholder:ph,target:getRows().length,moved:false,pointerId:e.pointerId};
          handle.addEventListener('pointermove',move);
          handle.addEventListener('pointerup',end);
          handle.addEventListener('pointercancel',end);
        });
      }
    });
  }
  if(editBtn)editBtn.onclick=()=>{
    reorderMode=!reorderMode;
    editBtn.textContent='編集';
    if(addBtn)addBtn.style.display=reorderMode?'inline-flex':'none';
    renderCounterList();
  };
  function addCounter(){
    let n=1;let name=`ボタン${n}`;
    while(d.counters.some(c=>c.name===name)){n++;name=`ボタン${n}`}
    d.counters.push({name,count:0});saveCounters();renderCounterList();
  }
  if(addBtn) addBtn.onclick=addCounter;
  renderCounterList();

}

    handle.addEventListener('pointermove',e=>{if(!drag||drag.row!==row)return;e.preventDefault();const dy=e.clientY-drag.startY;drag.moved=true;row.style.transform=`translateY(${dy}px)`;const rows=[...list.querySelectorAll('.dragRow')],idx=rows.indexOf(row),next=rows[idx+1],prev=rows[idx-1];if(next&&e.clientY>next.getBoundingClientRect().top+next.offsetHeight/2){list.insertBefore(next,row);[machine.modeOrder[idx],machine.modeOrder[idx+1]]=[machine.modeOrder[idx+1],machine.modeOrder[idx]];drag.startY=e.clientY;row.style.transform='translateY(0)'}else if(prev&&e.clientY<prev.getBoundingClientRect().top+prev.offsetHeight/2){list.insertBefore(row,prev);[machine.modeOrder[idx],machine.modeOrder[idx-1]]=[machine.modeOrder[idx-1],machine.modeOrder[idx]];drag.startY=e.clientY;row.style.transform='translateY(0)'}});
    const end=()=>{if(!drag||drag.row!==row)return;row.classList.remove('dragging');row.style.transition='';row.style.transform='';if(drag.moved)save();drag=null};handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end);handle.addEventListener('lostpointercapture',end);
  });
  const back=document.createElement('button');back.className='headerBtn';back.style.cssText='width:100%;height:44px;border-radius:10px;margin-top:10px';back.textContent='← 管理画面に戻る';back.onclick=()=>openModeSettings(machineName);box.appendChild(back)
