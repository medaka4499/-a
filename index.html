function deleteMode(machineName,mode){
  const machine=state.machines[machineName];
  if(!machine||!machine.modes[mode])return;
  if(mode==='通常'){alert('「通常」は基本モードのため削除できません');return}
  const modeNames=Object.keys(machine.modes);
  if(modeNames.length<=1){alert('モードは1つ以上必要です');return}
  if(!confirm(`「${mode}」を削除しますか？`))return;

  // 削除前の編集状態を保持
  const wasEditing=modeEditActive;

  // データと並び順から完全に削除
  delete machine.modes[mode];
  machine.modeOrder=(machine.modeOrder||Object.keys(machine.modes)).filter(x=>x!==mode&&machine.modes[x]);

  // 表示中のモードを安全に次のモードへ移動
  const remainingModes=(machine.modeOrder.length?machine.modeOrder:Object.keys(machine.modes)).filter(x=>machine.modes[x]);
  if(state.selected===machineName&&!remainingModes.includes(displayMode)){
    displayMode=remainingModes[0]||'通常';
  }

  save();

  // 本体・モード切替・機種管理画面をすべて即時更新
  renderMachineSelect();
  renderModeSwitch();
  if(state.selected===machineName)render();

  // 「機種を管理」画面を開いたまま、削除した行が確実に消えるよう再描画
  if(state.selected===machineName){
    openModeSettings(machineName);
    if(wasEditing) toggleModeEdit();
  }
}

function parseSettingRate(raw,counter){
  let v=String(raw??'').trim().replace(/％/g,'%').replace(/,/g,'');
  if(!v)return 0;
  const isPercent=String(counter?.displayFormat||'fraction')==='percent' || v.includes('%');
  v=v.replace(/1\s*\/\s*/,'').replace('%','').trim();
  const n=Number(v);
  if(!Number.isFinite(n)||n<=0)return 0;
  return isPercent?n:1/n;
}

    const gf=String(c.gameFormula||'').trim();
    if(gf)exposure=calcGameFormula(d,c);
    if(!Number.isFinite(exposure)||exposure<=0)return;
    const observed=count/exposure;
    if(!Number.isFinite(observed))return;
    const expected=rates.map(x=>parseSettingRate(x,c));
    if(expected.some(x=>x>0))usable.push({c,count,exposure,observed,expected});

  const prevBarWidths=Array(6).fill(0);

      const isAllowed=allowedJudge.includes(i+1);
      const isEnabled=isAllowed&&active[i];
      if(!isAllowed)card.style.display='none';
      const isLow=isEnabled&&weights[i]>0&&p===minProb;
      const isHigh=isEnabled&&weights[i]>0&&p===maxProb;
      card.className='judgeSetting'+(isLow?' low':'')+(isHigh?' high':'')+(!isEnabled?' disabled':'');
      const barWidth=isEnabled?Math.min(100,Math.max(0,p)):0;
      const startWidth=Math.min(100,Math.max(0,prevBarWidths[i]||0));
      card.innerHTML=`<label class="judgeCheckLabel" aria-label="設定${i+1}"><input class="judgeCheck" type="checkbox" ${isEnabled?'checked':''}><span class="judgeCheckMark" aria-hidden="true"></span></label><div class="judgeSettingLabel">設定${i+1}</div><div class="judgeBar"><i style="width:${startWidth}%"></i></div><div class="judgePercent">${p.toFixed(3)} %</div>`;
      const bar=card.querySelector('.judgeBar i');
      bars.push({bar,target:barWidth,i});
      const chk=card.querySelector('.judgeCheck');
      chk.addEventListener('change',()=>{active[i]=chk.checked;renderRows()});
      grid.appendChild(card);
    }
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        bars.forEach(({bar,target,i})=>{bar.style.width=target+'%';prevBarWidths[i]=target});
        grid.querySelectorAll('.judgePercent').forEach(el=>{
          let size=22;
          el.style.fontSize=size+'px';
          el.style.whiteSpace='nowrap';
          while(el.scrollWidth>el.clientWidth && size>12){
            size-=1;
            el.style.fontSize=size+'px';
          }
        });
      });
    });
  };
  box.appendChild(grid);
  renderRows();

  const detail=document.createElement('div');detail.className='judgeDetail';
  if(!usable.length){detail.innerHTML='<div style="padding:10px 0;color:#9da8b7">設定1～6の確率が登録されているカウンターがありません。<br>機種管理 → カウンター編集で設定値を登録してください。</div>'}
  else{usable.forEach(u=>{const row=document.createElement('div');row.className='judgeDetailRow';const rateText=u.c.displayFormat==='percent'?`${(u.observed*100).toFixed(2)}%`:`1/${(1/u.observed).toFixed(2)}`;row.innerHTML=`<span>${u.c.name}　実測 ${rateText}</span><span>${u.count}回</span>`;detail.appendChild(row)})}
  box.appendChild(detail);
  document.getElementById('judgeDetailBtn').onclick=()=>{detail.scrollIntoView({behavior:'smooth',block:'start'});};
  document.getElementById('judgeCountBtn').onclick=()=>{detail.style.display=detail.style.display==='none'?'block':'none';};
  const back=document.createElement('button');back.className='headerBtn';back.style.cssText='width:100%;height:44px;border-radius:10px;margin-top:12px';back.textContent='← 戻る';back.onclick=()=>{box.style.display='none';modal.classList.remove('show');render()};box.appendChild(back);
}
