<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小役カウンター">
<link rel="manifest" href="manifest.webmanifest">
<title>小役カウンター</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{margin:0;background:#0b0f14;color:#f5f7fa;min-height:100vh}
main{max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 24px)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:22px;margin:0}.sub{font-size:12px;color:#7f8a99;margin-top:3px}
button{border:0;color:#fff;font:inherit;font-weight:700;touch-action:manipulation}
.headerBtn{background:#222a35;border-radius:12px;padding:10px 12px}
.card{background:#151b23;border:1px solid #27303c;border-radius:18px;padding:15px;margin-bottom:11px}
.gbox{display:grid;grid-template-columns:1fr auto;align-items:center}
.label{font-size:12px;color:#9da8b7}.gcount{font-size:38px;font-weight:800;letter-spacing:-1px}
.gbuttons{display:flex;gap:7px}.gbuttons button{min-width:58px;height:50px;border-radius:14px;background:#2a3340}
.primary,.plus{background:#2563eb!important}
.counter{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.name{font-size:18px;font-weight:800}.rate{font-size:14px;color:#aeb8c5;margin-top:4px}
.actions{display:flex;gap:7px}.minus{width:48px;height:58px;border-radius:14px;background:#343d49;font-size:22px}
.plus{width:76px;height:58px;border-radius:14px;font-size:28px}
.small{margin-top:7px;font-size:11px;color:#687585}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#10151c;border-radius:14px;padding:11px}
.stat b{display:block;font-size:19px;margin-top:3px}
.reset{width:100%;height:48px;border-radius:14px;color:#ffb4b4;background:#2a2022;margin-top:2px}
footer{text-align:center;color:#697586;font-size:11px;padding:8px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:5}
.sheet{width:100%;max-width:560px;margin:auto;background:#151b23;border-radius:22px 22px 0 0;padding:18px}
.sheet input{width:100%;height:48px;border-radius:12px;border:1px solid #303a48;background:#0d1218;color:#fff;padding:0 12px;font-size:17px}
.sheetRow{display:flex;gap:8px;margin-top:10px}.sheetRow button{flex:1;height:46px;border-radius:12px;background:#2a3340}.sheetRow .primary{background:#2563eb}
.item{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:10px 0;border-bottom:1px solid #26303b}.del{background:#3a2528;border-radius:9px;padding:7px 10px;color:#ffb4b4}
</style>
</head>
<body>
<main>
<header><div><h1>小役カウンター</h1><div class="sub">iPhone / PWA対応</div></div><button class="headerBtn" id="manage">⚙ 小役</button></header>
<section class="card gbox"><div><div class="label">総ゲーム数</div><div class="gcount" id="games">0 G</div></div>
<div class="gbuttons"><button id="gminus">−1</button><button class="primary" id="gplus">＋1</button></div></section>
<div id="counters"></div>
<section class="card"><div class="label">集計</div><div class="stats">
<div class="stat"><span class="label">小役合計</span><b id="total">0</b></div>
<div class="stat"><span class="label">最頻小役</span><b id="top">—</b></div>
</div></section>
<button class="reset" id="reset">データをリセット</button>
<footer>データはこのiPhoneのブラウザに保存されます。オフラインでも利用できます。</footer>
</main>

<div class="modal" id="modal"><div class="sheet">
<div class="label">小役を追加</div>
<div style="margin-top:7px"><input id="newName" maxlength="20" placeholder="例：弱チェリー"></div>
<div class="sheetRow"><button id="close">閉じる</button><button class="primary" id="add">追加</button></div>
<div id="items"></div>
</div></div>

<script>
const KEY="koyaku-counter-v2";
const DEFAULT={games:0,counters:[{name:"ベル",count:0},{name:"スイカ",count:0},{name:"チェリー",count:0}]};
let state=JSON.parse(localStorage.getItem(KEY)||"null")||structuredClone(DEFAULT);
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function rate(n){return n&&state.games?`1/${(state.games/n).toFixed(2)}`:"—"}
function render(){
 document.getElementById("games").textContent=state.games+" G";
 const root=document.getElementById("counters"); root.innerHTML="";
 state.counters.forEach((c,i)=>{
  const card=document.createElement("section"); card.className="card counter";
  card.innerHTML='<div><div class="name"></div><div class="rate"></div><div class="small">この小役のカウント</div></div><div class="actions"><button class="minus">−</button><button class="plus">＋</button></div>';
  card.querySelector(".name").textContent=c.name+"  "+c.count;
  card.querySelector(".rate").textContent=rate(c.count);
  card.querySelector(".minus").onclick=()=>{if(c.count>0){c.count--;save()}};
  card.querySelector(".plus").onclick=()=>{c.count++;save()};
  root.appendChild(card);
 });
 const total=state.counters.reduce((a,c)=>a+c.count,0);
 const top=state.counters.reduce((a,c)=>c.count>a.count?c:a,{name:"—",count:0});
 document.getElementById("total").textContent=total;
 document.getElementById("top").textContent=top.count?`${top.name} ${top.count}`:"—";
 renderItems();
}
function renderItems(){
 const el=document.getElementById("items"); el.innerHTML="";
 state.counters.forEach((c,i)=>{
  const row=document.createElement("div");row.className="item";
  row.innerHTML=`<span></span><button class="del">削除</button>`;
  row.firstChild.textContent=c.name;
  row.querySelector(".del").onclick=()=>{if(confirm(`「${c.name}」を削除しますか？`)){state.counters.splice(i,1);save()}};
  el.appendChild(row);
 });
}
document.getElementById("gplus").onclick=()=>{state.games++;save()};
document.getElementById("gminus").onclick=()=>{if(state.games>0)state.games--;save()};
document.getElementById("reset").onclick=()=>{if(confirm("現在のゲーム数と小役カウントをすべてリセットしますか？")){state.games=0;state.counters.forEach(c=>c.count=0);save()}};
const modal=document.getElementById("modal");
document.getElementById("manage").onclick=()=>{modal.style.display="flex";document.getElementById("newName").focus()};
document.getElementById("close").onclick=()=>modal.style.display="none";
document.getElementById("add").onclick=()=>{const input=document.getElementById("newName"),name=input.value.trim();if(name){state.counters.push({name,count:0});input.value="";save();modal.style.display="none"}};
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
render();
</script>
</body>
</html>
